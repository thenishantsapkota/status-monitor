name: Status Monitor

on:
  schedule:
    # Every 15 minutes (UTC). GitHub's cron granularity is 5 min and runs are
    # best-effort — they can be delayed several minutes under load.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed to commit the updated state.json back to the repo

concurrency:
  group: status-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check status and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node status-monitor.mjs

      - name: Persist state
        run: |
          git add state.json
          # --cached catches both new (untracked) and modified state files.
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update status state [skip ci]"
            git push
          fi
