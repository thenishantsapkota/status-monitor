name: Status Monitor

on:
  schedule:
    # ~Every 15 minutes (UTC), on odd offsets to dodge the :00/:15/:30/:45
    # stampede — GitHub services off-peak cron slots more reliably. Runs are
    # still best-effort and can be delayed or dropped under load.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed to commit the updated state.json back to the repo

concurrency:
  group: status-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check status and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node status-monitor.mjs

      - name: Persist state
        run: |
          git add state.json
          # --cached catches both new (untracked) and modified state files.
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update status state [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to push state after 3 attempts."
                exit 1
              fi
              echo "Push rejected (attempt $attempt). Retrying..."
              sleep 2
            done
          fi
